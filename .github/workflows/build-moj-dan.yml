name: Build Moj dan APK

on:
  push:
    branches: ["moj-dan-android"]
    paths:
      - "moj-dan-android/**"
      - ".github/workflows/build-moj-dan.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Izdelaj APK
        working-directory: moj-dan-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Shrani APK
        uses: actions/upload-artifact@v4
        with:
          name: Moj-dan-APK
          path: moj-dan-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
