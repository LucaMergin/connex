name: Build Deliva v0.5 APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "deliva-build-v05/**"
      - ".github/workflows/build-deliva-v05.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Sestavi projektni ZIP
        run: |
          cat deliva-build-v05/source.b64.part-* > /tmp/deliva-v05.b64
          base64 --decode /tmp/deliva-v05.b64 > /tmp/Deliva_v0.5_source.zip || true
          wc -c /tmp/deliva-v05.b64 /tmp/Deliva_v0.5_source.zip
          sha256sum /tmp/deliva-v05.b64 /tmp/Deliva_v0.5_source.zip
      - name: Shrani diagnostični ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Deliva-v0.5-source-check
          path: |
            /tmp/deliva-v05.b64
            /tmp/Deliva_v0.5_source.zip
          if-no-files-found: error
