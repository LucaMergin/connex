name: Build SoundCheck Assistant APK (PR)

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract embedded project
        shell: bash
        run: |
          sed -n '/^[[:space:]]*UEsDB/,/^[[:space:]]*B64$/p' .github/workflows/build-soundcheck.yml | head -n -1 | tr -d ' ' > /tmp/soundcheck.b64
          base64 --decode /tmp/soundcheck.b64 > /tmp/soundcheck.zip
          unzip -q /tmp/soundcheck.zip -d "$GITHUB_WORKSPACE/generated"

      - name: Build APK
        working-directory: generated/SoundCheckAssistant
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp generated/SoundCheckAssistant/app/build/outputs/apk/release/app-release.apk SoundCheck-Assistant-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-Assistant-v0.1
          path: SoundCheck-Assistant-v0.1.apk
          if-no-files-found: error
          retention-days: 30
