name: Build SoundCheck Assistant v0.4.0

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Reconstruct v0.3.2 source
        shell: bash
        run: |
          cat \
            soundcheck-v032/fix00.txt \
            soundcheck-v032/fix01.txt \
            soundcheck-v032/fix02.txt \
            soundcheck-v032/fix03.txt \
            soundcheck-v032/fix04.txt \
            soundcheck-v032/fix05.txt \
            soundcheck-v032/fix06.txt \
            soundcheck-v032/fix07.txt \
            soundcheck-v032/fix08.txt \
            soundcheck-v032/chunk03.txt \
            soundcheck-v032/chunk04.txt \
            > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 36952
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "157c92a8f56fd557d934df6f6df37e028bee5477b46270d806b00f61350e95fb  /tmp/source.zip" | sha256sum --check
          rm -rf generated
          mkdir -p generated
          unzip -q /tmp/source.zip -d generated

      - name: Apply v0.3.3 smooth graphs
        shell: bash
        run: |
          patch -p1 -d generated < soundcheck-v033/smooth-graphs.patch

      - name: Apply v0.4.0 professional update
        shell: bash
        run: |
          base64 --decode soundcheck-v040/patch.xz.b64 | xz -d > /tmp/soundcheck-v040.patch
          patch -p1 -d generated < /tmp/soundcheck-v040.patch
          grep "versionCode 7" generated/SoundCheckAssistant/app/build.gradle
          grep "versionName '0.4.0'" generated/SoundCheckAssistant/app/build.gradle
          grep "showSplashScreen" generated/SoundCheckAssistant/app/src/main/java/si/ell/soundcheck/MainActivity.java
          grep "PEAK_HOLD_MS" generated/SoundCheckAssistant/app/src/main/java/si/ell/soundcheck/MainActivity.java
          grep "showCalibrationDialog" generated/SoundCheckAssistant/app/src/main/java/si/ell/soundcheck/MainActivity.java

      - name: Build release APK
        working-directory: generated/SoundCheckAssistant
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="generated/SoundCheckAssistant/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-package.txt
          grep "package: name='si.ell.soundcheck.v02fix' versionCode='7' versionName='0.4.0'" apk-package.txt
          unzip -t "$APK" | tee apk-unzip-test.txt
          cp "$APK" SoundCheck-Assistant-v0.4.0-unsigned.apk
          sha256sum SoundCheck-Assistant-v0.4.0-unsigned.apk > apk-sha256.txt
          cd generated && zip -qr ../SoundCheckAssistant-v0.4.0-source.zip SoundCheckAssistant

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-Assistant-v0.4.0-build
          path: |
            SoundCheck-Assistant-v0.4.0-unsigned.apk
            SoundCheckAssistant-v0.4.0-source.zip
            apk-package.txt
            apk-unzip-test.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
