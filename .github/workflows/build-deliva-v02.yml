name: Build Deliva v0.2 APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "deliva-v02-build/**"
      - ".github/workflows/build-deliva-v02.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Razpakiraj projekt
        run: unzip -q deliva-v02-build/Deliva_v0.2_source.zip -d .
      - name: Izdelaj APK
        working-directory: deliva_v02_src
        run: gradle :app:assembleDebug --stacktrace
      - name: Pripravi namestitveno datoteko
        run: cp deliva_v02_src/app/build/outputs/apk/debug/app-debug.apk /tmp/Deliva-v0.2.apk
      - name: Shrani APK
        uses: actions/upload-artifact@v4
        with:
          name: Deliva-v0.2-APK
          path: /tmp/Deliva-v0.2.apk
          if-no-files-found: error
