name: Build SoundCheck Assistant APK

on:
  push:
    branches: ["soundcheck-assistant-build"]
    paths:
      - ".github/workflows/build-soundcheck.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create project
        shell: bash
        run: |
          cat > /tmp/soundcheck.b64 <<'B64'
          
          B64
          base64 --decode /tmp/soundcheck.b64 > /tmp/soundcheck.zip
          unzip -q /tmp/soundcheck.zip -d "$GITHUB_WORKSPACE/generated"

      - name: Build APK
        working-directory: generated/SoundCheckAssistant
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp generated/SoundCheckAssistant/app/build/outputs/apk/release/app-release.apk SoundCheck-Assistant-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-Assistant-v0.1
          path: SoundCheck-Assistant-v0.1.apk
          if-no-files-found: error
          retention-days: 30
