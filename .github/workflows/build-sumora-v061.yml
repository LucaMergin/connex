name: Build Sumora v0.6.1 APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "sumora-build-v061/**"
      - ".github/workflows/build-sumora-v061.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Obnovi preverjeni projekt Sumora v0.6
        run: |
          set -euxo pipefail
          ls -lah sumora-build-v06
          cat sumora-build-v06/source.part-* > /tmp/sumora-v06.b64
          test "$(wc -c < /tmp/sumora-v06.b64)" = "46556"
          base64 --decode /tmp/sumora-v06.b64 > /tmp/Sumora_v0.6_source.zip
          echo "7a3e38250de39ac0b03daf6e0dafb6899e1c7ed41d69625a4638667ce859adb8  /tmp/Sumora_v0.6_source.zip" | sha256sum -c -
          unzip -t /tmp/Sumora_v0.6_source.zip
          unzip -q /tmp/Sumora_v0.6_source.zip -d .
          test -f sumora_v06_src/app/build.gradle

      - name: Uporabi popravek Sumora v0.6.1
        run: |
          set -euxo pipefail
          base64 --decode sumora-build-v061/sumora_v061.patch.gz.b64 > /tmp/sumora-v061.patch.gz
          gzip -t /tmp/sumora-v061.patch.gz
          gunzip -c /tmp/sumora-v061.patch.gz > /tmp/sumora-v061.patch
          cd sumora_v06_src
          git apply --check /tmp/sumora-v061.patch
          git apply /tmp/sumora-v061.patch

      - name: Očisti projekt pred gradnjo
        run: |
          set -euxo pipefail
          cd sumora_v06_src
          rm -rf app/build build .gradle

      - name: Izdelaj nepodpisan release APK
        working-directory: sumora_v06_src
        run: gradle clean :app:assembleRelease --stacktrace --no-build-cache --rerun-tasks

      - name: Zapiši manifest APK
        run: |
          set -euxo pipefail
          APK="sumora_v06_src/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          APP_ID=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")
          VERSION_CODE=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK")
          VERSION_NAME=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK")
          printf 'application_id=%s\nversion_code=%s\nversion_name=%s\n' "$APP_ID" "$VERSION_CODE" "$VERSION_NAME" | tee /tmp/Sumora-v0.6.1-manifest.txt

      - name: Pripravi pregled vsebine DEX
        run: |
          set -euxo pipefail
          APK="sumora_v06_src/app/build/outputs/apk/release/app-release-unsigned.apk"
          : > /tmp/sumora-classes.strings
          for DEX in $(unzip -Z1 "$APK" | grep '^classes.*\.dex$'); do
            unzip -p "$APK" "$DEX" > "/tmp/$DEX"
            strings "/tmp/$DEX" >> /tmp/sumora-classes.strings
          done
          test -s /tmp/sumora-classes.strings
          URL_VALUE=$(sed -n 's/^SUMORA_SUPABASE_URL=//p' sumora_v06_src/gradle.properties)
          KEY_VALUE=$(sed -n 's/^SUMORA_SUPABASE_PUBLISHABLE_KEY=//p' sumora_v06_src/gradle.properties)
          URL_PRESENT=no
          KEY_PRESENT=no
          VERSION_PRESENT=no
          grep -Fq "$URL_VALUE" /tmp/sumora-classes.strings && URL_PRESENT=yes || true
          grep -Fq "$KEY_VALUE" /tmp/sumora-classes.strings && KEY_PRESENT=yes || true
          grep -Fq "Sumora v0.6.1" /tmp/sumora-classes.strings && VERSION_PRESENT=yes || true
          printf 'supabase_url=%s\npublishable_key=%s\nversion_label=%s\n' "$URL_PRESENT" "$KEY_PRESENT" "$VERSION_PRESENT" | tee /tmp/Sumora-v0.6.1-content-check.txt

      - name: Poravnaj APK in pripravi podpisovalnik
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 sumora_v06_src/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Sumora-v0.6.1-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/apksigner.jar

      - name: Shrani gradbene datoteke
        uses: actions/upload-artifact@v4
        with:
          name: Sumora-v0.6.1-build
          path: |
            /tmp/Sumora-v0.6.1-unsigned-aligned.apk
            /tmp/apksigner.jar
            /tmp/Sumora-v0.6.1-manifest.txt
            /tmp/Sumora-v0.6.1-content-check.txt
          if-no-files-found: error

      - name: Končno preverjanje APK
        run: |
          set -euxo pipefail
          grep -Fxq 'application_id=si.deliva.app' /tmp/Sumora-v0.6.1-manifest.txt
          grep -Fxq 'version_code=7' /tmp/Sumora-v0.6.1-manifest.txt
          grep -Fxq 'version_name=0.6.1' /tmp/Sumora-v0.6.1-manifest.txt
          grep -Fxq 'supabase_url=yes' /tmp/Sumora-v0.6.1-content-check.txt
          grep -Fxq 'publishable_key=yes' /tmp/Sumora-v0.6.1-content-check.txt
          grep -Fxq 'version_label=yes' /tmp/Sumora-v0.6.1-content-check.txt
