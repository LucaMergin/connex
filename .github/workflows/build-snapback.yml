name: Build SnapBack APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "snapback-android/**"
      - ".github/workflows/build-snapback.yml"
  push:
    branches: ["master"]
    paths:
      - "snapback-android/**"
      - ".github/workflows/build-snapback.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Izdelaj SnapBack APK
        working-directory: snapback-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Shrani APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapBack-v0.1-APK
          path: snapback-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
