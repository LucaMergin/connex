name: Build Deliva APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "deliva-android/**"
      - ".github/workflows/build-deliva.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Izdelaj APK
        working-directory: deliva-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Pripravi datoteko
        run: cp deliva-android/app/build/outputs/apk/debug/app-debug.apk /tmp/Deliva-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Deliva-v0.1-APK
          path: /tmp/Deliva-v0.1.apk
          if-no-files-found: error
