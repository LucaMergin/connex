name: Build Sumora v0.6 APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "sumora-build-v06/**"
      - ".github/workflows/build-sumora-v06.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Pripravi Sumora projekt
        run: |
          cat deliva-build-v05/safe.part-* > /tmp/deliva-v05.b64
          test "$(wc -c < /tmp/deliva-v05.b64)" = "44552"
          base64 --decode /tmp/deliva-v05.b64 > /tmp/Deliva_v0.5_source.zip
          echo "0b47cee785e6f6760eb059db473810ccd1b76499d2902ddc60eab7dc1775c59c  /tmp/Deliva_v0.5_source.zip" | sha256sum -c -
          unzip -t /tmp/Deliva_v0.5_source.zip
          unzip -q /tmp/Deliva_v0.5_source.zip -d .
          base64 --decode sumora-build-v06/sumora_v06.patch.gz.b64 > /tmp/sumora.patch.gz
          gunzip -c /tmp/sumora.patch.gz > /tmp/sumora.patch
          cd deliva_v05_src
          git apply /tmp/sumora.patch
          grep -F "versionCode 6" app/build.gradle
          grep -F "versionName '0.6.0'" app/build.gradle
          grep -F "Sumora v0.6" app/src/main/java/si/deliva/app/MainActivity.java
          rm -rf app/build build .gradle

      - name: Izdelaj nepodpisan release APK
        working-directory: deliva_v05_src
        run: gradle clean :app:assembleRelease --stacktrace --no-build-cache --rerun-tasks

      - name: Preveri vsebino in različico APK
        run: |
          APK="deliva_v05_src/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")" = "si.deliva.app"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK")" = "6"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK")" = "0.6.0"
          unzip -p "$APK" classes.dex | strings | grep -F "Sumora v0.6"
          if unzip -p "$APK" classes.dex | strings | grep -F "Deliva v0.5"; then
            echo "Napaka: APK še vedno vsebuje oznako Deliva v0.5."
            exit 1
          fi

      - name: Poravnaj APK in pripravi podpisovalnik
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 deliva_v05_src/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Sumora-v0.6-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/apksigner.jar

      - name: Shrani gradbene datoteke
        uses: actions/upload-artifact@v4
        with:
          name: Sumora-v0.6-build-fixed
          path: |
            /tmp/Sumora-v0.6-unsigned-aligned.apk
            /tmp/apksigner.jar
          if-no-files-found: error
