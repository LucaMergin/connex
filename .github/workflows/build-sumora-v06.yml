name: Build Sumora v0.6 APK

on:
  pull_request:
    branches: ["master"]
    paths:
      - "sumora-build-v06/**"
      - ".github/workflows/build-sumora-v06.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Pripravi Sumora projekt
        run: |
          unzip -q deliva-build-v05/Deliva_v0.5_source.zip
          base64 --decode sumora-build-v06/sumora_v06.patch.gz.b64 > /tmp/sumora.patch.gz
          gunzip -c /tmp/sumora.patch.gz > /tmp/sumora.patch
          cd deliva_v05_src
          git apply /tmp/sumora.patch

      - name: Izdelaj nepodpisan release APK
        working-directory: deliva_v05_src
        run: gradle :app:assembleRelease --stacktrace

      - name: Poravnaj APK in pripravi podpisovalnik
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 deliva_v05_src/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Sumora-v0.6-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/apksigner.jar

      - name: Shrani gradbene datoteke
        uses: actions/upload-artifact@v4
        with:
          name: Sumora-v0.6-build
          path: |
            /tmp/Sumora-v0.6-unsigned-aligned.apk
            /tmp/apksigner.jar
          if-no-files-found: error
