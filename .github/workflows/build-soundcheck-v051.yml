name: Build SoundCheck Assistant v0.5.1

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Reconstruct v0.3.2 source
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            soundcheck-v032/fix00.txt \
            soundcheck-v032/fix01.txt \
            soundcheck-v032/fix02.txt \
            soundcheck-v032/fix03.txt \
            soundcheck-v032/fix04.txt \
            soundcheck-v032/fix05.txt \
            soundcheck-v032/fix06.txt \
            soundcheck-v032/fix07.txt \
            soundcheck-v032/fix08.txt \
            soundcheck-v032/chunk03.txt \
            soundcheck-v032/chunk04.txt \
            > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 36952
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "157c92a8f56fd557d934df6f6df37e028bee5477b46270d806b00f61350e95fb  /tmp/source.zip" | sha256sum --check
          rm -rf generated
          mkdir -p generated
          unzip -q /tmp/source.zip -d generated

      - name: Apply v0.3.3 smooth graphs
        shell: bash
        run: |
          set -euxo pipefail
          patch --batch -p1 -d generated < soundcheck-v033/smooth-graphs.patch

      - name: Apply v0.4.0 professional update
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode soundcheck-v040/patch.xz.b64 > /tmp/soundcheck-v040.patch.xz
          xz --test /tmp/soundcheck-v040.patch.xz
          xz -dc /tmp/soundcheck-v040.patch.xz > /tmp/soundcheck-v040.patch
          patch --batch -p1 -d generated < /tmp/soundcheck-v040.patch

      - name: Apply v0.4.1 measurement update
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode soundcheck-v041/patch.xz.b64 > /tmp/soundcheck-v041.patch.xz
          echo "d2b88072a6c508c6c253c04cbdc753dd1f1e369754c8626f312b8103eafc7b33  /tmp/soundcheck-v041.patch.xz" | sha256sum --check
          xz -dc /tmp/soundcheck-v041.patch.xz > /tmp/soundcheck-v041.patch
          echo "7eac4a7f81411e4c6dedbe5222a24d5a6b771f1d5d3a5fa2e85747099a8fdc32  /tmp/soundcheck-v041.patch" | sha256sum --check
          patch --batch -p1 -d generated < /tmp/soundcheck-v041.patch

      - name: Apply v0.5.0 guided Band Check
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode soundcheck-v050/patch.xz.b64 > /tmp/soundcheck-v050.patch.xz
          echo "b069b073bb02688c1bf50087d01c80cb8647fd77a21933bc2b00b243cd16f1ed  /tmp/soundcheck-v050.patch.xz" | sha256sum --check
          xz -dc /tmp/soundcheck-v050.patch.xz > /tmp/soundcheck-v050.patch
          echo "0d22cd6c5b7735c199df7f70a5e2b3a5d3b66f6f6fa49f9478f392f53d3f42f2  /tmp/soundcheck-v050.patch" | sha256sum --check
          patch --batch -p1 -d generated < /tmp/soundcheck-v050.patch

      - name: Apply v0.5.1 Professional Accuracy Update
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode soundcheck-v051/patch.xz.b64 > /tmp/soundcheck-v051.patch.xz
          echo "f02ae3403d8a334ee52df44be44db3c37a0dfb525c990da9d9ddab1c820b6ea1  /tmp/soundcheck-v051.patch.xz" | sha256sum --check
          xz --test /tmp/soundcheck-v051.patch.xz
          xz -dc /tmp/soundcheck-v051.patch.xz > /tmp/soundcheck-v051.patch
          echo "db4b6ae6fc899ce7180e8ed8f2013deec9f123048ded7460889497bb03edf53f  /tmp/soundcheck-v051.patch" | sha256sum --check
          patch --batch --dry-run -p1 -d generated < /tmp/soundcheck-v051.patch
          patch --batch -p1 -d generated < /tmp/soundcheck-v051.patch

      - name: Verify v0.5.1 source changes
        shell: bash
        run: |
          set -euxo pipefail
          JAVA="generated/SoundCheckAssistant/app/src/main/java/si/ell/soundcheck/MainActivity.java"
          grep -F "versionCode 10" generated/SoundCheckAssistant/app/build.gradle
          grep -F "versionName '0.5.1'" generated/SoundCheckAssistant/app/build.gradle
          grep -F "FFT_HOP_SIZE = FFT_SIZE / 2" "$JAVA"
          grep -F "windowSum" "$JAVA"
          grep -F "buildThirdOctave" "$JAVA"
          grep -F "verjetno PREVLADUJE" "$JAVA"
          grep -F "aplikacija ne more določiti, na kateri točki signalne poti je clipping nastal" "$JAVA"
          ! grep -F "% nad referenco" "$JAVA"
          ! grep -F "% pod referenco" "$JAVA"

      - name: Build release APK
        working-directory: generated/SoundCheckAssistant
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee ../../../build-v051.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-Assistant-v0.5.1-log
          path: build-v051.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="generated/SoundCheckAssistant/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-package.txt
          grep -F "package: name='si.ell.soundcheck.v02fix' versionCode='10' versionName='0.5.1'" apk-package.txt
          unzip -t "$APK" | tee apk-unzip-test.txt
          cp "$APK" SoundCheck-Assistant-v0.5.1-unsigned.apk
          sha256sum SoundCheck-Assistant-v0.5.1-unsigned.apk > apk-sha256.txt
          cd generated && zip -qr ../SoundCheckAssistant-v0.5.1-source.zip SoundCheckAssistant

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-Assistant-v0.5.1-build
          path: |
            SoundCheck-Assistant-v0.5.1-unsigned.apk
            SoundCheckAssistant-v0.5.1-source.zip
            apk-package.txt
            apk-unzip-test.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
